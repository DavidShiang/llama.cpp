name: Build llama-server Only

on:
  #push:
  #  branches: [ "master", "main" ]
  #  paths:
  #    - 'examples/server/**'
  #    - 'common/**'
  #    - 'src/**'
  #    - 'include/**'
  #    - 'CMakeLists.txt'
  #pull_request:
  #  branches: [ "master", "main" ]
  workflow_dispatch: # 支持在 GitHub 网页上手动点击触发编译

permissions:
  contents: write

jobs:
  build-ubuntu:
    name: Build Ubuntu (CPU Only)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive' # 确保依赖的子模块完整拉取

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLAMA_BUILD_CLI=OFF \
          -DLLAMA_BUILD_EXAMPLES=OFF \
          -DLLAMA_BUILD_TESTS=OFF \
          -DLLAMA_BUILD_SERVER=ON

    - name: Build llama-server Target Only
      run: |
        cmake --build build --config Release --target llama-server -j $(nproc)

    - name: Upload Build Artifact
      # 修复点 1：使用官方唯一正宗的构件上传组件，彻底解决 repository not found 报错
      uses: actions/upload-artifact@v4
      with:
        name: llama-server-ubuntu-x64
        path: build/bin/llama-server

  build-ubuntu-cuda:
    name: Build Ubuntu (CUDA Enabled)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    # 修复点 2：GitHub 官方的 ubuntu-latest 镜像其实已经预装了 CUDA 全套环境！
    # 根本不需要使用任何高风险的第三方 cuda-toolkit-action。
    # 我们只需要通过这两行原生 Shell 脚本，把系统里预装的 CUDA 软链接和环境变量激活即可。
    - name: Verify and Set Up Pre-installed CUDA
      run: |
        echo "Checking pre-installed CUDA versions..."
        ls -l /usr/local/cuda* || true
        # 默认指向系统预装的最稳定版本
        export CUDA_PATH=/usr/local/cuda
        echo "CUDA_PATH=$CUDA_PATH" >> $GITHUB_ENV
        echo "$CUDA_PATH/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=$CUDA_PATH/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

    - name: Configure CMake with CUDA
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLAMA_GGML_CUDA=ON \
          -DLLAMA_BUILD_CLI=OFF \
          -DLLAMA_BUILD_EXAMPLES=OFF \
          -DLLAMA_BUILD_TESTS=OFF \
          -DLLAMA_BUILD_SERVER=ON

    - name: Build llama-server Target (CUDA)
      run: |
        cmake --build build --config Release --target llama-server -j $(nproc)

    - name: Upload CUDA Artifact
      # 修复点 3：同样同步为官方标准的构建上传组件
      uses: actions/upload-artifact@v4
      with:
        name: llama-server-ubuntu-cuda
        path: build/bin/llama-server
